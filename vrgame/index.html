<html>
    <head>
        <title>Minecraft: Kill the Creepers</title>
        <script src="https://aframe.io/releases/1.0.3/aframe.min.js"></script>
        <script src="https://unpkg.com/aframe-environment-component@1.1.0/dist/aframe-environment-component.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
        <script src="https://unpkg.com/aframe-aabb-collider-component@^2.2.1/dist/aframe-aabb-collider-component.min.js"></script>
        <script src="minecraftJS.js"></script>
        <!-- audio removed: the .mp3 asset files were not kept -->
    </head>
    <body>
        <a-scene start-game>
          <a-entity environment = "preset: forest;"></a-entity>
          <a-sphere
        radius="1"
        color='#grey'
        position="-10 0 -6"
        animation = "property: rotation; from: 0 0 0; to: 0 360 0; loop: true; easing: linear"
      ></a-sphere>
          <a-sphere
        radius="0.5"
        color='#grey'
        position="7 0 6"
        animation = "property: rotation; from: 0 0 0; to: 0 360 0; loop: true; easing: linear"></a-sphere>
          <a-obj-model
        class = "creepercl"
        visible = "false"
        src = "creepermodel.obj"
        mtl = "creepercolor.mtl"
        scale = "5 5 5"
        position = "0 2 0"
        animation="property: position; to: 0 2 0; dur: 10000;"
        aabb-collider='objects:.projectile;'
      ></a-obj-model>
          <a-obj-model
        src = "chickenmodel.obj"
        mtl = "chickencolor.mtl"
        class = "chichen"
        scale = "3.5 3.5 3.5"
        aabb-collider='objects:.projectile;'
        position = "0 1 0"
        animation="property: position;from: 2 1 2; to: 10 1 -10; dur: 10000; animation-iteration-count: infinite;"
      ></a-obj-model>
          <a-obj-model
        class = "chest"
        src = "chest.obj"
        mtl = "chestcolor.mtl"
        scale = "3 3 3"
        position = "0 1 0"
        visible = "false"
      ></a-obj-model>
          <a-obj-model
        class='arrow'
        id = 'arrowid'
        src="arrow.obj"
        visible = "false"
        position = "0 1.4 0"
        scale="1 1 1"
        color = "brown"
        rotation = "0 0 0"
        animation="property: position; to:0 2 0; dur: 10000;  easing: linear;"
      ></a-obj-model>
           <a-obj-model
        class='menu-creeper'
        aabb-collider='objects:.projectile;'
        src="creepermodel.obj"
        mtl = "creepercolor.mtl"
        rotation = "0 180 0"
        position="0 2 -5"
        scale = "5 5 5"
       ></a-obj-model>
          <a-text id="toplay" position="-1.8 0.5 -2" value="How to play: Kill the creepers with arrows to protect your base. Kill the menu creeper to begin" color="#f1c40f" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
          <a-text id="game-title" position="-1.4 2.5 -2" value="Minecraft: Kill the Creepers" color="#f1c40f" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
          <a-camera position = "0 1.6 0" active = "false"class = "carmera">
          </a-camera>
          <a-camera position = "0 1.6 0" active = "true" rotation-reader>
            <a-sphere color = "blue" scale = "0.1 0.1 0.1"></a-sphere>
            <a-text position = "-0.7 1.5 -2" value = "Gunpowder: 0" id = "score-text" color = "grey" visible="false"></a-text>
            <a-text position = "-1.5 -1.5 -2" value = "CREEPER BLU UP YOUR STUFFZ" visible = "false" id = "gameover-text"
                animation = "property: opacity; from: 1; to: 0; dur: 1000; loop:true; dir:alternate;"></a-text>
            <a-cursor color = "blue" geometry = "primitive: ring;"shoot = ".arrow" class = "carmera2" colorrrr></a-cursor>
          </a-camera>
        </a-scene>
    </body>
</html>
